<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Uhrzeit lernen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Uhrzeit">
    <meta name="theme-color" content="#E2F7F8">
    
    <style>
        :root {
            --app-bg: #E2F7F8;
            --clock-day: #FAE7E2;
            --clock-night: #C2D2E9;
            --text-title: #111111;
            --text-sub: #333333;
            --hand-hour: #4F05F8;
            --hand-minute: #DEC0DF;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", sans-serif;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            background-color: var(--app-bg);
        }

        body {
            height: 100dvh;
            background-color: var(--app-bg);
            color: var(--text-title);
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: max(10px, env(safe-area-inset-top));
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            padding-left: 16px;
            padding-right: 16px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 360px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        /* Top Bar */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .streak-badge {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            color: #d97706;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .fire-icon {
            display: inline-block;
            transform-origin: center bottom;
            font-size: 1.25rem;
        }

        .fire-pop {
            animation: firePop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes firePop {
            0% { transform: scale(1); }
            30% { transform: scale(2.1) rotate(-14deg); filter: drop-shadow(0 0 10px rgba(255, 149, 0, 0.9)); }
            55% { transform: scale(1.8) rotate(14deg); }
            75% { transform: scale(2.0) rotate(-6deg); }
            100% { transform: scale(1) rotate(0deg); filter: none; }
        }

        .speaker-btn {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            color: var(--text-title);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .speaker-btn:active {
            transform: scale(0.92);
        }

        /* Überschriften linksbündig */
        .task-card {
            width: 100%;
            max-width: 320px;
            text-align: left;
            flex-shrink: 0;
            padding-left: 2px;
        }

        .task-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.3px;
        }

        .task-subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 3px;
            font-weight: 600;
        }

        /* Einheitliche Breite für Kontroll- & Displayelemente */
        .ui-fixed-width {
            width: 100%;
            max-width: 320px;
        }

        /* Segmented Switcher für Zeiger */
        .hand-switcher {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            padding: 4px;
            display: flex;
            gap: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }

        .hand-segment {
            flex: 1;
            padding: 9px 8px;
            border-radius: 14px;
            border: 1px solid transparent;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color: #333333;
            background: transparent;
        }

        .hand-segment.active-hour {
            background: linear-gradient(135deg, #4F05F8 0%, #3502ad 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 14px rgba(79, 5, 248, 0.4);
        }

        .hand-segment.active-minute {
            background: linear-gradient(135deg, #DEC0DF 0%, #ba97bb 100%);
            color: #311833;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 14px rgba(222, 192, 223, 0.6);
        }

        .hand-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-hour { background: #4F05F8; }
        .dot-minute { background: #DEC0DF; border: 1px solid rgba(0,0,0,0.15); }

        .hand-segment.active-hour .dot-hour {
            background: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        }

        .hand-segment.active-minute .dot-minute {
            background: #311833;
            box-shadow: 0 0 6px rgba(49, 24, 51, 0.4);
        }

        /* Digital Display Card */
        .digital-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            padding: 6px 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.85);
            text-align: center;
            flex-shrink: 0;
        }

        .digital-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #444444;
            letter-spacing: 1.2px;
        }

        .digital-time {
            font-size: 2.1rem;
            font-weight: 800;
            color: #000000;
            font-variant-numeric: tabular-nums;
            font-family: "SF Mono", Menlo, monospace;
        }

        /* Uhr-Container */
        .clock-wrapper {
            position: relative;
            width: min(65vw, 250px);
            height: min(65vw, 250px);
            touch-action: none;
            flex-shrink: 0;
            margin: 2px 0;
        }

        canvas#clockCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--clock-day);
            transition: background-color 0.6s ease;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12), inset 0 0 0 1.5px rgba(255, 255, 255, 0.85);
        }

        /* Stepper für Digitaluhr */
        .stepper-container {
            display: flex;
            gap: 14px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }

        .stepper-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stepper-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #333333;
        }

        .stepper-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-btn {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: var(--text-title);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-btn:active {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(0.92);
        }

        .step-val {
            font-size: 1rem;
            font-weight: 800;
            color: #000000;
            width: 42px;
            text-align: center;
        }

        /* Prüfen Button - Gleiche Breite wie der Einstellbereich */
        .check-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.35) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #000000;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-top: 2px solid #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 13px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
        }

        .check-btn.success-glow {
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.45) 0%, rgba(52, 199, 89, 0.2) 100%);
            border-color: rgba(52, 199, 89, 0.8);
        }

        .check-btn.error-shake {
            animation: shakeButton 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.35) 0%, rgba(255, 59, 48, 0.15) 100%);
            border-color: rgba(255, 59, 48, 0.7);
        }

        @keyframes shakeButton {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        #btnConfettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .check-btn-text {
            position: relative;
            z-index: 3;
        }

        .check-btn:active {
            transform: scale(0.98);
        }

        /* Feier Overlay */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .celebration-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .celebration-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.5) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            padding: 28px 36px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15), inset 0 1px 2px #ffffff;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .celebration-overlay.active .celebration-card {
            transform: scale(1);
        }

        .celebration-emoji {
            font-size: 4.8rem;
            line-height: 1.1;
            animation: bounceEmoji 1s infinite alternate ease-in-out;
        }

        .celebration-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #000000;
            margin-top: 10px;
        }

        .celebration-sub {
            font-size: 1.05rem;
            font-weight: 700;
            color: #d97706;
            margin-top: 4px;
        }

        @keyframes bounceEmoji {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="streak-badge">
            <span class="fire-icon" id="fireEmoji">🔥</span> <span id="streakCount">0</span>
        </div>
        <button class="speaker-btn" onclick="speakTask()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5-1.23L6 6H2v12h4l5.5 4V2zM14 8.86v6.28c1.38-.64 2.33-2.02 2.33-3.14s-.95-2.5-2.33-3.14z"/>
            </svg>
        </button>
    </div>

    <!-- Linksbündige Titel -->
    <div class="task-card">
        <div class="task-title" id="taskTitle">Stelle die Uhr!</div>
        <div class="task-subtitle" id="taskSub">Wähle einen Zeiger und drehe ihn.</div>
    </div>

    <div class="digital-box ui-fixed-width" id="targetDigitalBox">
        <div class="digital-label">ZIELZEIT</div>
        <div class="digital-time" id="digitalTargetTime">14:10</div>
    </div>

    <!-- Segmented Switcher (genau gleiche Breite wie der Button) -->
    <div class="hand-switcher ui-fixed-width" id="handSwitcher">
        <button class="hand-segment active-hour" id="segHour" onclick="selectHand('hour')">
            <span class="hand-dot dot-hour"></span>
            <span>1. Stunde (Lila)</span>
        </button>
        <button class="hand-segment" id="segMinute" onclick="selectHand('minute')">
            <span class="hand-dot dot-minute"></span>
            <span>2. Minute (Flieder)</span>
        </button>
    </div>

    <div class="clock-wrapper">
        <canvas id="clockCanvas" width="560" height="560"></canvas>
    </div>

    <!-- Stepper für Digitaluhr (gleiche Breite) -->
    <div class="stepper-container ui-fixed-width" id="digitalInputGroup" style="display: none;">
        <div class="stepper-group">
            <span class="stepper-label">Stunde (0–23)</span>
            <div class="stepper-controls">
                <button class="step-btn" onclick="changeUserTime('hour', -1)">−</button>
                <span class="step-val" id="hourVal">12h</span>
                <button class="step-btn" onclick="changeUserTime('hour', 1)">+</button>
            </div>
        </div>
        <div style="width: 1px; background: rgba(0, 0, 0, 0.15);"></div>
        <div class="stepper-group">
            <span class="stepper-label">Minute (10er)</span>
            <div class="stepper-controls">
                <button class="step-btn" onclick="changeUserTime('minute', -10)">−</button>
                <span class="step-val" id="minuteVal">00m</span>
                <button class="step-btn" onclick="changeUserTime('minute', 10)">+</button>
            </div>
        </div>
    </div>

    <!-- Prüfen Button (gleiche Breite) -->
    <button class="check-btn ui-fixed-width" id="checkButton" onclick="checkAnswer()">
        <canvas id="btnConfettiCanvas"></canvas>
        <span class="check-btn-text" id="checkButtonText">Prüfen ✓</span>
    </button>
</div>

<div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-card">
        <div class="celebration-emoji" id="celebrationEmoji">🥳</div>
        <div class="celebration-title" id="celebrationTitle">Klasse gemacht!</div>
        <div class="celebration-sub" id="celebrationSub">3 Richtige hintereinander!</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;

    const btnConfettiCanvas = document.getElementById('btnConfettiCanvas');
    const btnConfettiCtx = btnConfettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimationId = null;

    let streak = 0;
    let mode = 'digitalToAnalog';
    let currentHandStep = 'hour';
    let targetTime = { hour: 12, minute: 0 };
    let userTime = { hour: 12, minute: 0 };

    // --- Audio Feedback ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playCorrectSound() {
        initAudio();
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(523.25, now);
        osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
        osc2.frequency.setValueAtTime(783.99, now + 0.08);

        gainNode.gain.setValueAtTime(0.18, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now + 0.08);
        osc1.stop(now + 0.35);
        osc2.stop(now + 0.35);
    }

    function playWrongSound() {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.setValueAtTime(220, now + 0.15);

        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
    }

    function playCelebrationFanfare() {
        initAudio();
        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];

        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const startT = now + idx * 0.09;

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startT);

            gainNode.gain.setValueAtTime(0.2, startT);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startT + (idx === 3 ? 0.6 : 0.25));

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(startT);
            osc.stop(startT + (idx === 3 ? 0.6 : 0.25));
        });
    }

    function playTickSound() {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, now);
        gainNode.gain.setValueAtTime(0.04, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.03);
    }

    function triggerFireAnimation() {
        const fireEl = document.getElementById('fireEmoji');
        fireEl.classList.remove('fire-pop');
        void fireEl.offsetWidth;
        fireEl.classList.add('fire-pop');
    }

    function triggerButtonError() {
        const btn = document.getElementById('checkButton');
        btn.classList.remove('error-shake');
        void btn.offsetWidth;
        btn.classList.add('error-shake');

        setTimeout(() => {
            btn.classList.remove('error-shake');
        }, 500);
    }

    // --- Button-Konfetti ---
    const confettiColors = ['#4F05F8', '#DEC0DF', '#34c759', '#ff9500', '#ff3b30', '#ffcc00', '#007aff'];

    function triggerButtonConfetti() {
        const btn = document.getElementById('checkButton');
        btn.classList.add('success-glow');

        const rect = btn.getBoundingClientRect();
        btnConfettiCanvas.width = rect.width * 2;
        btnConfettiCanvas.height = rect.height * 2;

        const w = btnConfettiCanvas.width;
        const h = btnConfettiCanvas.height;

        confettiParticles = [];
        const count = 48;

        for (let i = 0; i < count; i++) {
            confettiParticles.push({
                x: w / 2 + (Math.random() - 0.5) * (w * 0.4),
                y: h * 0.5,
                vx: (Math.random() - 0.5) * 14,
                vy: (Math.random() - 0.8) * 11,
                size: Math.random() * 7 + 4,
                color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 18,
                opacity: 1,
                shape: Math.random() > 0.4 ? 'rect' : 'circle'
            });
        }

        if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
        animateButtonConfetti();

        setTimeout(() => {
            btn.classList.remove('success-glow');
        }, 1100);
    }

    function animateButtonConfetti() {
        btnConfettiCtx.clearRect(0, 0, btnConfettiCanvas.width, btnConfettiCanvas.height);
        let alive = false;

        confettiParticles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.vx *= 0.96;
            p.rotation += p.rotSpeed;
            p.opacity -= 0.016;

            if (p.opacity > 0) {
                alive = true;
                btnConfettiCtx.save();
                btnConfettiCtx.translate(p.x, p.y);
                btnConfettiCtx.rotate((p.rotation * Math.PI) / 180);
                btnConfettiCtx.globalAlpha = Math.max(0, p.opacity);
                btnConfettiCtx.fillStyle = p.color;

                if (p.shape === 'rect') {
                    btnConfettiCtx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.7);
                } else {
                    btnConfettiCtx.beginPath();
                    btnConfettiCtx.arc(0, 0, p.size / 2, 0, 2 * Math.PI);
                    btnConfettiCtx.fill();
                }
                btnConfettiCtx.restore();
            }
        });

        if (alive) {
            confettiAnimationId = requestAnimationFrame(animateButtonConfetti);
        } else {
            btnConfettiCtx.clearRect(0, 0, btnConfettiCanvas.width, btnConfettiCanvas.height);
        }
    }

    const partyEmojis = ['🥳', '🚀', '🦁', '🦄', '🦖', '🏆', '🎉', '🌟'];

    function show3erCelebration(currentStreak) {
        const overlay = document.getElementById('celebrationOverlay');
        const emojiEl = document.getElementById('celebrationEmoji');
        const subEl = document.getElementById('celebrationSub');

        const randomEmoji = partyEmojis[Math.floor(Math.random() * partyEmojis.length)];
        emojiEl.innerText = randomEmoji;
        subEl.innerText = `${currentStreak} Richtige hintereinander!`;

        overlay.classList.add('active');
        playCelebrationFanfare();

        setTimeout(() => {
            overlay.classList.remove('active');
            newRound();
        }, 1800);
    }

    function getDaytimeDescriptor(hour) {
        if (hour >= 6 && hour < 12) return { text: "☀️ Morgens", isDay: true, speech: "am Vormittag" };
        if (hour >= 12 && hour < 18) return { text: "☀️ Nachmittag", isDay: true, speech: "am Nachmittag" };
        if (hour >= 18 && hour < 22) return { text: "🌙 Abends", isDay: false, speech: "am Abend" };
        return { text: "🌙 Nachts", isDay: false, speech: "in der Nacht" };
    }

    function updateClockFaceColor(hour) {
        const isDay = (hour >= 6 && hour < 18);
        canvas.style.backgroundColor = isDay ? 'var(--clock-day)' : 'var(--clock-night)';
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }

    function formatSpokenTime(h, m) {
        return m === 0 ? `${h} Uhr` : `${h} Uhr ${m}`;
    }

    function speakTask() {
        if (mode === 'digitalToAnalog') {
            if (currentHandStep === 'hour') {
                speak(`Stelle zuerst den lila Stundenzeiger auf ${formatSpokenTime(targetTime.hour, 0)}.`);
            } else {
                speak(`Stelle jetzt den hellen Minutenzeiger auf ${targetTime.minute} Minuten.`);
            }
        } else {
            const desc = getDaytimeDescriptor(targetTime.hour);
            speak(`Wie spät ist es auf der Uhr ${desc.speech}? Stelle die 24-Stunden-Digitaluhr ein.`);
        }
    }

    function newRound() {
        const validMinutes = [0, 10, 20, 30, 40, 50];
        targetTime.hour = Math.floor(Math.random() * 24);
        targetTime.minute = validMinutes[Math.floor(Math.random() * validMinutes.length)];
        mode = Math.random() > 0.5 ? 'digitalToAnalog' : 'analogToDigital';
        currentHandStep = 'hour';

        updateClockFaceColor(targetTime.hour);

        if (mode === 'digitalToAnalog') {
            userTime = { hour: 12, minute: 0 };
            document.getElementById('taskTitle').innerText = 'Stelle die Uhr!';
            document.getElementById('taskSub').innerText = 'Drehe zuerst den lila Stundenzeiger.';
            document.getElementById('targetDigitalBox').style.display = 'block';
            document.getElementById('digitalInputGroup').style.display = 'none';
            document.getElementById('handSwitcher').style.display = 'flex';
            document.getElementById('digitalTargetTime').innerText = 
                `${String(targetTime.hour).padStart(2,'0')}:${String(targetTime.minute).padStart(2,'0')}`;
            updateHandSwitcherUI();
        } else {
            userTime = { hour: 12, minute: 0 };
            document.getElementById('taskTitle').innerText = 'Wie spät ist es?';
            document.getElementById('taskSub').innerText = 'Schau auf die Zeiger und das Zifferblatt:';
            document.getElementById('targetDigitalBox').style.display = 'none';
            document.getElementById('digitalInputGroup').style.display = 'flex';
            document.getElementById('handSwitcher').style.display = 'none';

            updateStepperUI();
        }

        drawClock();
        setTimeout(speakTask, 350);
    }

    function selectHand(hand) {
        initAudio();
        currentHandStep = hand;
        updateHandSwitcherUI();
        drawClock();
        speakTask();
        triggerFeedback();
    }

    function updateHandSwitcherUI() {
        const segH = document.getElementById('segHour');
        const segM = document.getElementById('segMinute');
        const sub = document.getElementById('taskSub');

        if (currentHandStep === 'hour') {
            segH.className = 'hand-segment active-hour';
            segM.className = 'hand-segment';
            sub.innerText = 'Drehe den lila Stundenzeiger zur richtigen Zahl.';
        } else {
            segH.className = 'hand-segment';
            segM.className = 'hand-segment active-minute';
            sub.innerText = 'Drehe den Flieder-Minutenzeiger in 10er-Schritten.';
        }
    }

    function changeUserTime(type, delta) {
        initAudio();
        if (type === 'hour') {
            userTime.hour = (userTime.hour + delta + 24) % 24;
        } else {
            userTime.minute = (userTime.minute + delta + 60) % 60;
        }
        updateStepperUI();
        triggerFeedback();
    }

    function updateStepperUI() {
        document.getElementById('hourVal').innerText = `${String(userTime.hour).padStart(2,'0')}h`;
        document.getElementById('minuteVal').innerText = `${String(userTime.minute).padStart(2,'0')}m`;
    }

    function checkAnswer() {
        initAudio();
        let isCorrect = false;
        if (mode === 'digitalToAnalog') {
            const targetMod12 = targetTime.hour % 12;
            const userMod12 = userTime.hour % 12;
            isCorrect = (targetMod12 === userMod12 && targetTime.minute === userTime.minute);
        } else {
            isCorrect = (targetTime.hour === userTime.hour && targetTime.minute === userTime.minute);
        }

        if (isCorrect) {
            streak++;
            document.getElementById('streakCount').innerText = streak;
            triggerFireAnimation();
            triggerButtonConfetti();

            if (streak % 3 === 0) {
                show3erCelebration(streak);
            } else {
                playCorrectSound();
                speak("Super gemacht!");
                setTimeout(newRound, 1200);
            }
        } else {
            streak = 0;
            document.getElementById('streakCount').innerText = streak;
            triggerButtonError();
            playWrongSound();
            speak("Probier es noch einmal!");
        }
    }

    function triggerFeedback() {
        playTickSound();
        if (navigator.vibrate) navigator.vibrate(10);
    }

    // --- GROSSES HANDGEZEICHNETES DOODLE ZEICHNEN (Hintergrund Zifferblatt) ---
    function drawDoodleBackground(cx, cy, hour) {
        const isDay = (hour >= 6 && hour < 18);
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (isDay) {
            // --- DOODLE SONNE ---
            const sunR = 64;
            const sunColor = 'rgba(255, 179, 71, 0.38)';
            const rayColor = 'rgba(255, 153, 51, 0.32)';

            // Sonnenstrahlen als handgemalte Wellen/Striche
            ctx.strokeStyle = rayColor;
            ctx.lineWidth = 4;
            for (let i = 0; i < 12; i++) {
                const ang = (i * Math.PI) / 6;
                const r1 = sunR + 10;
                const r2 = sunR + 26 + (i % 2 === 0 ? 8 : 0);
                
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
                // Leichte Krümmung für handgemalten Doodle-Look
                const cpX = cx + Math.cos(ang + 0.1) * (r1 + 10);
                const cpY = cy + Math.sin(ang + 0.1) * (r1 + 10);
                ctx.quadraticCurveTo(cpX, cpY, cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2);
                ctx.stroke();
            }

            // Sonnen-Kreis
            ctx.fillStyle = sunColor;
            ctx.beginPath();
            ctx.arc(cx, cy, sunR, 0, 2 * Math.PI);
            ctx.fill();

            // Doodle-Augen
            ctx.strokeStyle = 'rgba(120, 60, 10, 0.28)';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(cx - 24, cy - 14, 6, 0, Math.PI); // linkes Zwinkerauge
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx + 24, cy - 14, 6, 0, Math.PI); // rechtes Zwinkerauge
            ctx.stroke();

            // Fröhliches Doodle-Lächeln
            ctx.beginPath();
            ctx.arc(cx, cy + 2, 22, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();

            // Rosa Doodle-Wangen
            ctx.fillStyle = 'rgba(255, 105, 180, 0.25)';
            ctx.beginPath();
            ctx.arc(cx - 32, cy + 8, 7, 0, 2 * Math.PI);
            ctx.arc(cx + 32, cy + 8, 7, 0, 2 * Math.PI);
            ctx.fill();

        } else {
            // --- DOODLE MOND & STERNE ---
            const moonColor = 'rgba(255, 225, 110, 0.42)';
            const starColor = 'rgba(255, 235, 150, 0.45)';

            // Funkelnde Doodle-Sterne im Hintergrund
            function drawDoodleStar(sx, sy, size) {
                ctx.strokeStyle = starColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sx - size, sy);
                ctx.lineTo(sx + size, sy);
                ctx.moveTo(sx, sy - size);
                ctx.lineTo(sx, sy + size);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(sx, sy, size * 0.35, 0, 2 * Math.PI);
                ctx.fillStyle = starColor;
                ctx.fill();
            }

            drawDoodleStar(cx - 65, cy - 50, 9);
            drawDoodleStar(cx + 70, cy - 42, 11);
            drawDoodleStar(cx - 50, cy + 55, 8);
            drawDoodleStar(cx + 60, cy + 50, 10);

            // Mondsichel (Organisch gezeichnet)
            ctx.fillStyle = moonColor;
            ctx.beginPath();
            ctx.arc(cx - 6, cy, 62, -0.45 * Math.PI, 0.55 * Math.PI, false);
            ctx.quadraticCurveTo(cx + 35, cy, cx - 6 + 62 * Math.cos(-0.45 * Math.PI), cy + 62 * Math.sin(-0.45 * Math.PI));
            ctx.fill();

            // Schlafendes Auge auf dem Mond
            ctx.strokeStyle = 'rgba(50, 60, 110, 0.35)';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(cx + 20, cy - 12, 7, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            // Sanfte Schlafwange
            ctx.fillStyle = 'rgba(255, 140, 160, 0.25)';
            ctx.beginPath();
            ctx.arc(cx + 18, cy + 4, 6, 0, 2 * Math.PI);
            ctx.fill();
        }

        ctx.restore();
    }

    // --- Zifferblatt & Zeiger zeichnen ---
    function drawClock() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = radius;
        const cy = radius;
        const time = (mode === 'digitalToAnalog') ? userTime : targetTime;

        // 1. Großes Doodle im Hintergrund des Zifferblatts zeichnen
        drawDoodleBackground(cx, cy, targetTime.hour);

        // 2. 60 Minuten-Indikatoren
        for (let m = 0; m < 60; m++) {
            const angle = (m * Math.PI) / 30 - Math.PI / 2;
            const is5Min = (m % 5 === 0);
            const is10Min = (m % 10 === 0);

            if (is5Min) {
                const rOuter = radius - 16;
                const rInner = radius - 26;
                const x1 = cx + Math.cos(angle) * rOuter;
                const y1 = cy + Math.sin(angle) * rOuter;
                const x2 = cx + Math.cos(angle) * rInner;
                const y2 = cy + Math.sin(angle) * rInner;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = is10Min ? 3.5 : 2;
                ctx.strokeStyle = is10Min ? '#8a508c' : 'rgba(0, 0, 0, 0.35)';
                ctx.lineCap = 'round';
                ctx.stroke();
            } else {
                const rDot = radius - 21;
                const x = cx + Math.cos(angle) * rDot;
                const y = cy + Math.sin(angle) * rDot;

                ctx.beginPath();
                ctx.arc(x, y, 1.8, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fill();
            }
        }

        // 3. 10er-Minutenzahlen
        ctx.font = '800 16px -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif';
        ctx.fillStyle = '#8a508c';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        [0, 10, 20, 30, 40, 50].forEach(min => {
            const angle = (min * Math.PI) / 30 - Math.PI / 2;
            const rText = radius - 40;
            const x = cx + Math.cos(angle) * rText;
            const y = cy + Math.sin(angle) * rText;
            ctx.fillText(String(min).padStart(2, '0'), x, y);
        });

        // 4. Stundenzahlen
        ctx.font = 'bold 36px -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif';
        ctx.fillStyle = '#111111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let num = 1; num <= 12; num++) {
            const angle = (num * Math.PI) / 6 - Math.PI / 2;
            const rHour = radius - 80;
            const x = cx + Math.cos(angle) * rHour;
            const y = cy + Math.sin(angle) * rHour;
            ctx.fillText(num.toString(), x, y);
        }

        // 5. Zeigerwinkel
        const hourVal = (mode === 'digitalToAnalog' && currentHandStep === 'hour') 
            ? (time.hour % 12) 
            : (time.hour % 12) + (time.minute / 60);

        const hourAngle = (hourVal * Math.PI / 6) - Math.PI / 2;
        const minuteAngle = (time.minute * Math.PI / 30) - Math.PI / 2;

        const isHourActive = (mode !== 'digitalToAnalog' || currentHandStep === 'hour');
        const isMinuteActive = (mode !== 'digitalToAnalog' || currentHandStep === 'minute');

        // Stundenzeiger (Lila #4F05F8)
        drawHandDirect(cx, cy, hourAngle, radius * 0.46, isHourActive ? 14 : 9, isHourActive ? '#4F05F8' : 'rgba(79, 5, 248, 0.28)');
        
        // Minutenzeiger (Flieder #DEC0DF mit Kontur)
        drawHandDirect(cx, cy, minuteAngle, radius * 0.72, isMinuteActive ? 10 : 6, isMinuteActive ? '#DEC0DF' : 'rgba(222, 192, 223, 0.35)', isMinuteActive ? '#8a508c' : 'transparent');

        // Mittelpunkt
        ctx.beginPath();
        ctx.arc(cx, cy, 11, 0, 2 * Math.PI);
        ctx.fillStyle = '#111111';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
    }

    function drawHandDirect(cx, cy, angle, length, width, color, outlineColor = 'transparent') {
        ctx.save();
        ctx.beginPath();
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = color;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
        ctx.stroke();

        if (outlineColor !== 'transparent') {
            ctx.beginPath();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = outlineColor;
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
            ctx.stroke();
        }
        ctx.restore();
    }

    function handlePointer(e) {
        initAudio();
        if (mode !== 'digitalToAnalog') return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - (rect.left + rect.width / 2);
        const y = clientY - (rect.top + rect.height / 2);
        const dist = Math.sqrt(x * x + y * y);

        if (dist < 18) return;

        let angle = Math.atan2(y, x) * 180 / Math.PI + 90;
        if (angle < 0) angle += 360;

        if (currentHandStep === 'hour') {
            let hour12 = Math.round(angle / 30);
            if (hour12 === 0) hour12 = 12;
            const isPM = targetTime.hour >= 12;
            const newHour = (hour12 % 12) + (isPM ? 12 : 0);
            
            if (newHour !== userTime.hour) {
                userTime.hour = newHour;
                triggerFeedback();
            }
        } else {
            let rawMinute = Math.round(angle / 6) % 60;
            let snappedMin = Math.round(rawMinute / 10) * 10 % 60;
            
            if (snappedMin !== userTime.minute) {
                userTime.minute = snappedMin;
                triggerFeedback();
            }
        }
        drawClock();
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointer(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointer(e); }, { passive: false });
    canvas.addEventListener('mousedown', (e) => {
        handlePointer(e);
        const move = (ev) => handlePointer(ev);
        const up = () => {
            window.removeEventListener('mousemove', move);
            window.removeEventListener('mouseup', up);
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
    });

    newRound();
</script>
</body>
