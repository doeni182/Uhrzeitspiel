<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Uhrzeit lernen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Uhrzeit">
    
    <style>
        :root {
            --primary-blue: #007aff;
            --accent-orange: #ff9500;
            --hand-hour: #007aff;
            --hand-minute: #ff3b30;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            position: relative;
            background-color: #0f1026;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            overflow: hidden;
        }

        /* --- Dynamisch wabernder Multicolor Gradient Hintergrund --- */
        .gradient-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #15173c, #0a0b18);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(85px);
            opacity: 0.65;
            will-change: transform;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            animation-direction: alternate;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, #ff5e62, #ff9966);
            top: -10%;
            left: -15%;
            animation: moveBlob1 14s infinite alternate;
        }

        .blob-2 {
            width: 380px;
            height: 380px;
            background: linear-gradient(135deg, #7f00ff, #e100ff);
            bottom: -15%;
            right: -20%;
            animation: moveBlob2 18s infinite alternate;
        }

        .blob-3 {
            width: 340px;
            height: 340px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            top: 40%;
            left: 20%;
            animation: moveBlob3 16s infinite alternate;
        }

        .blob-4 {
            width: 260px;
            height: 260px;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            top: 20%;
            right: 5%;
            opacity: 0.45;
            animation: moveBlob4 13s infinite alternate;
        }

        @keyframes moveBlob1 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(80px, 120px) scale(1.15); }
            100% { transform: translate(160px, 40px) scale(0.9); }
        }

        @keyframes moveBlob2 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-100px, -90px) scale(1.2); }
            100% { transform: translate(-140px, 30px) scale(0.95); }
        }

        @keyframes moveBlob3 {
            0%   { transform: translate(0, 0) scale(0.9); }
            50%  { transform: translate(-80px, 90px) scale(1.25); }
            100% { transform: translate(60px, -60px) scale(1); }
        }

        @keyframes moveBlob4 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-60px, 80px) scale(0.85); }
            100% { transform: translate(70px, -40px) scale(1.1); }
        }

        /* --- Content Container --- */
        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        /* Top Bar */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(16px);

            color: #ffb340;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 6px 14px;
            border-radius: 20px;
