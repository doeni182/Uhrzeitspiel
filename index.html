<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Uhrzeit lernen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Uhrzeit">
    <meta name="theme-color" id="themeColorMeta" content="#EDC3D4">
    
    <style>
        :root {
            --bg-day: #EDC3D4;    /* Altrose */
            --bg-night: #C2D2E9;  /* Pastellblau */
            --text-title: #111111;
            --text-sub: #3a3a3c;
            --primary-blue: #007aff;
            --hand-hour: #007aff;
            --hand-minute: #ff3b30;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", sans-serif;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            background-color: var(--bg-day);
            transition: background-color 0.8s ease;
        }

        body {
            height: 100dvh;
            background-color: var(--bg-day);
            transition: background-color 0.8s ease;
            color: var(--text-title);
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: max(10px, env(safe-area-inset-top));
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            padding-left: 16px;
            padding-right: 16px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 360px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        /* Top Bar */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .streak-badge {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            color: #d97706;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .fire-icon {
            display: inline-block;
            transform-origin: center bottom;
            font-size: 1.25rem;
        }

        .fire-pop {
            animation: firePop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes firePop {
            0% { transform: scale(1); }
            30% { transform: scale(2.1) rotate(-14deg); filter: drop-shadow(0 0 10px rgba(255, 149, 0, 0.9)); }
            55% { transform: scale(1.8) rotate(14deg); }
            75% { transform: scale(2.0) rotate(-6deg); }
            100% { transform: scale(1) rotate(0deg); filter: none; }
        }

        .speaker-btn {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            color: var(--text-title);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .speaker-btn:active {
            transform: scale(0.92);
        }

        /* Aufgabenkarten */
        .task-card {
            text-align: center;
            flex-shrink: 0;
        }

        .task-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.2px;
        }

        .task-subtitle {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-top: 2px;
            font-weight: 600;
        }

        .daytime-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 4px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.55);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            color: var(--text-title);
        }

        /* Segmented Switcher */
        .hand-switcher {
            width: 100%;
            max-width: 330px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            padding: 4px;
            display: flex;
            gap: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }

        .hand-segment {
            flex: 1;
            padding: 9px 8px;
            border-radius: 14px;
            border: 1px solid transparent;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color: #48484a;
            background: transparent;
        }

        .hand-segment.active-hour {
            background: linear-gradient(135deg, #007aff 0%, #0056b3 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.35);
        }

        .hand-segment.active-minute {
            background: linear-gradient(135deg, #ff3b30 0%, #d70015 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 14px rgba(255, 59, 48, 0.35);
        }

        .hand-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-hour { background: #007aff; }
        .dot-minute { background: #ff3b30; }

        .hand-segment.active-hour .dot-hour,
        .hand-segment.active-minute .dot-minute {
            background: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        }

        /* Digital Display Card */
        .digital-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            padding: 6px 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.85);
            text-align: center;
            width: 70%;
            flex-shrink: 0;
        }

        .digital-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #636366;
            letter-spacing: 1.2px;
        }

        .digital-time {
            font-size: 2.1rem;
            font-weight: 800;
            color: #000000;
            font-variant-numeric: tabular-nums;
            font-family: "SF Mono", Menlo, monospace;
        }

        /* Uhr-Container */
        .clock-wrapper {
            position: relative;
            width: min(65vw, 250px);
            height: min(65vw, 250px);
            touch-action: none;
            flex-shrink: 0;
            margin: 2px 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), inset 0 0 0 1.5px rgba(255, 255, 255, 0.85);
        }

        /* Stepper für Digitaluhr */
        .stepper-container {
            display: flex;
            gap: 14px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }

        .stepper-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stepper-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #48484a;
        }

        .stepper-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-btn {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: var(--text-title);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-btn:active {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(0.92);
        }

        .step-val {
            font-size: 1rem;
            font-weight: 800;
            color: #000000;
            width: 40px;
            text-align: center;
        }

        /* Prüfen Button */
        .check-btn {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.35) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #000000;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-top: 2px solid #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 13px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .check-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.8);
        }

        /* Feier Overlay */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .celebration-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .celebration-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.5) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            padding: 28px 36px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15), inset 0 1px 2px #ffffff;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .celebration-overlay.active .celebration-card {
            transform: scale(1);
        }

        .celebration-emoji {
            font-size: 4.8rem;
            line-height: 1.1;
            animation: bounceEmoji 1s infinite alternate ease-in-out;
        }

        .celebration-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #000000;
            margin-top: 10px;
        }

        .celebration-sub {
            font-size: 1.05rem;
            font-weight: 700;
            color: #d97706;
            margin-top: 4px;
        }

        @keyframes bounceEmoji {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="streak-badge">
            <span class="fire-icon" id="fireEmoji">🔥</span> <span id="streakCount">0</span>
        </div>
        <button class="speaker-btn" onclick="speakTask()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5-1.23L6 6H2v12h4l5.5 4V2zM14 8.86v6.28c1.38-.64 2.33-2.02 2.33-3.14s-.95-2.5-2.33-3.14z"/>
            </svg>
        </button>
    </div>

    <div class="task-card">
        <div class="task-title" id="taskTitle">Stelle die Uhr!</div>
        <div class="task-subtitle" id="taskSub">Wähle einen Zeiger und drehe ihn.</div>

        <div id="daytimeBadgeWrapper" style="display: none;">
            <div class="daytime-badge" id="daytimeBadge">☀️ Vormittag / Tag</div>
        </div>
    </div>

    <div class="digital-box" id="targetDigitalBox">
        <div class="digital-label">ZIELZEIT</div>
        <div class="digital-time" id="digitalTargetTime">14:10</div>
    </div>

    <div class="hand-switcher" id="handSwitcher">
        <button class="hand-segment active-hour" id="segHour" onclick="selectHand('hour')">
            <span class="hand-dot dot-hour"></span>
            <span>1. Stunde (Blau)</span>
        </button>
        <button class="hand-segment" id="segMinute" onclick="selectHand('minute')">
            <span class="hand-dot dot-minute"></span>
            <span>2. Minute (Rot)</span>
        </button>
    </div>

    <div class="clock-wrapper">
        <canvas id="clockCanvas" width="560" height="560"></canvas>
    </div>

    <div class="stepper-container" id="digitalInputGroup" style="display: none;">
        <div class="stepper-group">
            <span class="stepper-label">Stunde (0–23)</span>
            <div class="stepper-controls">
                <button class="step-btn" onclick="changeUserTime('hour', -1)">−</button>
                <span class="step-val" id="hourVal">12h</span>
                <button class="step-btn" onclick="changeUserTime('hour', 1)">+</button>
            </div>
        </div>
        <div style="width: 1px; background: rgba(0, 0, 0, 0.15);"></div>
        <div class="stepper-group">
            <span class="stepper-label">Minute (10er)</span>
            <div class="stepper-controls">
                <button class="step-btn" onclick="changeUserTime('minute', -10)">−</button>
                <span class="step-val" id="minuteVal">00m</span>
                <button class="step-btn" onclick="changeUserTime('minute', 10)">+</button>
            </div>
        </div>
    </div>

    <button class="check-btn" onclick="checkAnswer()">Prüfen ✓</button>
</div>

<div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-card">
        <div class="celebration-emoji" id="celebrationEmoji">🥳</div>
        <div class="celebration-title" id="celebrationTitle">Klasse gemacht!</div>
        <div class="celebration-sub" id="celebrationSub">3 Richtige hintereinander!</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;

    let streak = 0;
    let mode = 'digitalToAnalog';
    let currentHandStep = 'hour';
